name: Agent review (fork)

# A fork's pull_request run gets no secrets, so claude-code-review.yml skips
# it. This file runs from main, never the fork's copy, and owns the fork's one
# agent-review check run: blocking on every new commit until a maintainer who
# has read the diff adds the safe-to-review label, then the labeled review's
# verdict. A push drops the label.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions: {}

jobs:
  # claude-code-review.yml skips forks, and a skipped check counts as passing,
  # so this blocking check is what keeps an unreviewed fork commit unmergeable.
  # It shares no concurrency group, so nothing can cancel it before it posts.
  await-label:
    if: >-
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/agent-review-verdict.sh await-label

  # Shares the review's group so a push cancels a review of the old commit.
  unlabel:
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'safe-to-review')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: agent-review-fork-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # A second quick push finds the label already gone.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/safe-to-review" --silent

  # Runs the fork's code with the Bedrock role, so it gets no token that can
  # write code or checks: only `report`, which never runs that code, can pass
  # the gate. Keep the review step in step with claude-code-review.yml.
  review:
    name: Claude review session (gated by agent-review)
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'safe-to-review' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Only the safe-to-review label joins the pull request's group, so adding
    # another label cannot cancel a review in progress.
    concurrency:
      group: agent-review-fork-${{ github.event.label.name == 'safe-to-review' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      authorized: ${{ steps.labeler.outputs.authorized }}
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      # Triage access is enough to add a label; vouching for code that runs
      # with credentials takes write access.
      - id: labeler
        name: Verify the labeler has write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          case "$level" in
            admin | write) echo "authorized=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::$SENDER lacks write access (permission: $level)" && exit 1 ;;
          esac

      # Read from main before the fork's checkout replaces the workspace.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: prompt
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed "s|{{PR}}|$GITHUB_REPOSITORY/pull/$PR|g" .github/prompts/agent-review.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # checkout and claude-code-action both guard against running a fork's
      # head here. Building and running it is this job's purpose, and the label
      # is the gate on that. The head SHA is the one the label was added to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # No npm cache: this context shares main's cache scope.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install and build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - id: review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          PIZZA_DATA_ROOT: ${{ runner.temp }}/pizza-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          allow_fork_prs: "true"
          # Its default denies npm/npx to an author without write access; the
          # label is this repository's decision to run the fork's code.
          restrict_untrusted_prs: "false"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --max-turns 120
            --allowedTools "Agent,Task,Skill,Glob,Grep,LS,Read,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npx vitest:*),Bash(npx tsx:*),Bash(npx tsc:*),Bash(npm test:*),Bash(npm run:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["ship","block"]},"blocking_findings":{"type":"integer","minimum":0},"summary":{"type":"string"},"files_reviewed":{"type":"array","items":{"type":"string"}}},"required":["verdict","blocking_findings","summary","files_reviewed"],"additionalProperties":false}'

  report:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.authorized == 'true' && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      RESULT: ${{ needs.review.outputs.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: enforce
        continue-on-error: true
        run: bash .github/scripts/agent-review-verdict.sh enforce

      - name: Post verdict
        continue-on-error: true
        env:
          GATE: ${{ steps.enforce.outcome }}
        run: bash .github/scripts/agent-review-verdict.sh post

      - name: Report agent-review on the labeled commit
        env:
          GATE: ${{ steps.enforce.outcome }}
        run: bash .github/scripts/agent-review-verdict.sh check-run
