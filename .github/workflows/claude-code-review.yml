name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  # Required to post the review as inline comments on the pull request.
  pull-requests: write
  issues: read
  # Lets GitHub mint the OIDC token that AWS exchanges for role credentials.
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # GitHub withholds secrets and the OIDC token from runs triggered by a fork
    # pull request, and gives Dependabot its own secret store, so neither can
    # reach Bedrock. Skipping them keeps a contributor's pull request from
    # collecting a failure at the credentials step; tag @claude on a fork pull
    # request instead, which runs in this repository's context (claude.yml).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools REPLACES the action's default tool set rather than
          # extending it, so the read tools have to be named here or Claude
          # reviews blind — it cannot open a file it wants to check. It is also
          # required for the inline-comment tool even though the skill's own
          # frontmatter names it, because the action starts that MCP server only
          # when claude_args asks for it. `gh pr comment` is how the skill reports
          # a clean review, so omitting it makes a no-findings run post nothing at
          # all. Nothing listed executes the pull request's own code, which a build
          # or test command would.
          #
          # Pinning the full model ID stops Claude Code from deriving a us.
          # profile from AWS_REGION. It does not confine the run to one model:
          # background tasks also invoke Haiku and Sonnet, inheriting the
          # global. prefix, so the role's policy must allow those profiles too.
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --max-turns 60
            --allowedTools "Glob,Grep,LS,Read,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
