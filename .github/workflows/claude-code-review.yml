name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  # Write so UI screenshots can be committed to the ui-screenshots branch,
  # the only way a comment can show an image.
  contents: write
  # Required to post the review as inline comments on the pull request.
  pull-requests: write
  issues: read
  # Lets GitHub mint the OIDC token that AWS exchanges for role credentials.
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `agent-review` is a required status check on main, so this job must FAIL,
  # never skip, when it cannot review: a job skipped by `if:` reports success.
  # Drafts are the one skip, because a draft cannot merge and marking it ready
  # re-runs the job.
  agent-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub withholds secrets and the OIDC token from fork pull requests and
      # gives Dependabot its own secret store, so neither can reach Bedrock. A
      # maintainer lands those by pushing the branch to this repository or by
      # admin merge.
      - name: Require a same-repository branch
        if: |
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]'
        run: |
          echo "::error::Agent review runs only on branches pushed to this repository by a collaborator."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Trust boundary: only branches in this repository reach the steps below,
      # and their authors already have write access, enough to push a workflow
      # that assumes the Bedrock role. The ordering and the subprocess scrub
      # keep credentials out of incidental output, not away from that code:
      # with id-token: write it can mint its own OIDC token, and the servers
      # ui-preview starts keep running through the later steps.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - id: ui
        uses: ./.github/actions/ui-preview
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs Claude's commands in a sandbox
      # that needs bubblewrap and socat, which the action installs only when
      # allowed_non_write_users is set. Ubuntu 24.04 also blocks the
      # unprivileged user namespaces bubblewrap uses unless the sysctl is off.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - id: review
        uses: anthropics/claude-code-action@v1
        env:
          # Strips cloud credentials from the environment of every command
          # Claude runs; see the trust boundary note above. GITHUB_TOKEN
          # survives the scrub.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          PIZZA_DATA_ROOT: ${{ runner.temp }}/pizza-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            You are the required reviewer for ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            The checkout is installed and built. CI separately runs the full build, typecheck, lint, and test suite, so do not re-run them wholesale.

            1. Invoke the `code-review:code-review` skill with args `--comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}`. Skip its eligibility checks: this run gates the merge, so always review the current head, even if Claude has already reviewed or commented on an earlier push.
            2. For each finding the review would rank important, try to confirm it by executing code: run the relevant tests with `npx vitest run --dir <workspace>`, or write a small failing test or `npx tsx` probe under `.agent-review/` and run it. Live model calls are unavailable; use the scripted-model harness in tests/langgraph-compat when a probe needs the runtime.
            3. Return verdict "block" if any important finding stands, whether it is confirmed by execution or clear from reading the code. Otherwise return "ship".

            Run every agent and task the review starts in the foreground, never with `run_in_background`, and wait for each to return before you continue: your verdict ends the session, so anything still running is lost. If the review did not finish (an agent failed, or you ran out of turns or time), return "block" and say which part went unreviewed; "ship" means the whole diff was reviewed.
          # --allowedTools REPLACES the action's default tool set, so the read
          # tools, the inline-comment MCP tool (started only when named here),
          # and `gh pr comment` (how the skill reports a clean review) must all be
          # listed. The npm/npx entries run the pull request's own code; that is
          # safe only because the first step admits collaborator branches alone.
          #
          # Pinning the full model ID stops Claude Code from deriving a us.
          # profile from AWS_REGION. It does not confine the run to one model:
          # background tasks also invoke Haiku and Sonnet, inheriting the
          # global. prefix, so the role's policy must allow those profiles too.
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --max-turns 120
            --allowedTools "Skill,Glob,Grep,LS,Read,Write,mcp__playwright,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(npx vitest:*),Bash(npx tsx:*),Bash(npx tsc:*),Bash(npm test:*),Bash(npm run:*)"
            ${{ steps.ui.outputs.started == 'true' && format('--mcp-config {0} --append-system-prompt-file .github/prompts/ui-screenshots.md', steps.ui.outputs.mcp_config) || '' }}
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["ship","block"]},"blocking_findings":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","blocking_findings","summary"],"additionalProperties":false}'

      - if: always() && steps.ui.outputs.started == 'true'
        uses: ./.github/actions/ui-shots-post
        # The action comes from the pull request's checkout, so it gets no AWS
        # credentials; it needs only the GitHub token.
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        with:
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fails closed: a run that ends without structured output (a refusal, the
      # turn cap) blocks the merge just as a "block" verdict does.
      - name: Enforce verdict
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(jq -r '.verdict // empty' <<<"$RESULT" 2>/dev/null || true)
          summary=$(jq -r '.summary // empty' <<<"$RESULT" 2>/dev/null || true)
          echo "### Agent review: ${verdict:-no verdict}" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            ship) echo "Agent review: ship" ;;
            block) echo "::error::Agent review blocked: $summary" && exit 1 ;;
            *) echo "::error::Agent review returned no verdict" && exit 1 ;;
          esac
