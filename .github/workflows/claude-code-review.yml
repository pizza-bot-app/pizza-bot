name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The event payload can still say draft after the pull request is marked
  # ready: a push right after `ready_for_review` cancels that run and arrives
  # with a stale payload. Read the live state instead.
  draft-state:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.pr.outputs.draft }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .draft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  # Runs the review session, which can write to its workspace; the verdict is
  # enforced by agent-review, a separate job the session never touches.
  # GitHub withholds secrets and the OIDC token from fork pull requests and
  # gives Dependabot its own secret store, so neither can reach Bedrock. A
  # fork is reviewed by agent-review-fork.yml once a maintainer labels it;
  # Dependabot is admin-merged.
  review:
    name: Claude review session (gated by agent-review)
    needs: draft-state
    if: |
      !cancelled() && needs.draft-state.outputs.draft != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Write so UI screenshots can be committed to the ui-screenshots branch,
      # the only way a comment can show an image.
      contents: write
      # Required to post inline findings on the pull request.
      pull-requests: write
      issues: read
      # Lets GitHub mint the OIDC token that AWS exchanges for role credentials.
      id-token: write
    outputs:
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Trust boundary: only branches in this repository reach this job, and
      # their authors already have write access, enough to push a workflow
      # that assumes the Bedrock role. The ordering and the subprocess scrub
      # keep credentials out of incidental output, not away from that code:
      # with id-token: write it can mint its own OIDC token, and the servers
      # ui-preview starts keep running through the later steps.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - id: ui
        uses: ./.github/actions/ui-preview
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs Claude's commands in a sandbox
      # that needs bubblewrap and socat, which the action installs only when
      # allowed_non_write_users is set. Ubuntu 24.04 also blocks the
      # unprivileged user namespaces bubblewrap uses unless the sysctl is off.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      # The prompt's `--reporter=agent` leaves out vitest's GitHub reporter: the
      # sandbox refuses its step summary write, and the warning reads as a failed run.
      - id: prompt
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed "s|{{PR}}|$GITHUB_REPOSITORY/pull/$PR|g" .github/prompts/agent-review.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - id: review
        uses: anthropics/claude-code-action@v1
        env:
          # Strips cloud credentials from the environment of every command
          # Claude runs; see the trust boundary note above. GITHUB_TOKEN
          # survives the scrub.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          PIZZA_DATA_ROOT: ${{ runner.temp }}/pizza-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: ${{ steps.prompt.outputs.text }}
          # --allowedTools REPLACES the action's default tool set, so the
          # subagent tool the review skill starts its reviewers with, the read
          # tools, and the inline-comment MCP tool (started only when named here)
          # must all be listed. The npm/npx entries run the pull request's own
          # code; that is safe only because the job's `if:` admits collaborator
          # branches alone.
          #
          # Pinning the full model ID stops Claude Code from deriving a us.
          # profile from AWS_REGION. It does not confine the run to one model:
          # background tasks also invoke Haiku and Sonnet, inheriting the
          # global. prefix, so the role's policy must allow those profiles too.
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --max-turns 120
            --allowedTools "Agent,Task,Skill,Glob,Grep,LS,Read,Write,mcp__playwright,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npx vitest:*),Bash(npx tsx:*),Bash(npx tsc:*),Bash(npm test:*),Bash(npm run:*)"
            ${{ steps.ui.outputs.started == 'true' && format('--mcp-config {0} --append-system-prompt-file .github/prompts/ui-screenshots.md', steps.ui.outputs.mcp_config) || '' }}
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["ship","block"]},"blocking_findings":{"type":"integer","minimum":0},"summary":{"type":"string"},"files_reviewed":{"type":"array","items":{"type":"string"}}},"required":["verdict","blocking_findings","summary","files_reviewed"],"additionalProperties":false}'

      - if: always() && steps.ui.outputs.started == 'true'
        uses: ./.github/actions/ui-shots-post
        # The action comes from the pull request's checkout, so it gets no AWS
        # credentials; it needs only the GitHub token.
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        with:
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # `agent-review` is a required status check on main, so this job must FAIL,
  # never skip, when it cannot review: a job skipped by `if:` reports success.
  # Two skips are safe. A draft cannot merge, and marking it ready re-runs the
  # job. A fork's commit always carries agent-review-fork.yml's own blocking
  # check, and branch protection fails if any agent-review on the commit does.
  # If the draft lookup fails, the review runs anyway.
  agent-review:
    needs: [draft-state, review]
    if: |
      !cancelled() && needs.draft-state.outputs.draft != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RESULT: ${{ needs.review.outputs.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Refuse Dependabot
        if: needs.review.result == 'skipped'
        run: |
          echo "::error::Dependabot's secret store cannot reach Bedrock, so a maintainer admin-merges its pull requests once CI passes."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Fails closed: a review that ends without structured output (a refusal,
      # the turn cap, a failed job) blocks the merge just as a "block" verdict does.
      - name: Enforce verdict
        id: enforce
        run: bash .github/scripts/agent-review-verdict.sh enforce

      # One comment per pull request, found by its marker and rewritten on each
      # push. Posting is best effort: the check alone gates the merge.
      - name: Post verdict
        if: ${{ !cancelled() && needs.review.result != 'skipped' }}
        continue-on-error: true
        env:
          GATE: ${{ steps.enforce.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/agent-review-verdict.sh post
