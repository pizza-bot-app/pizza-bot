name: Package

# Builds the desktop installers for every platform. Called by `release.yml` for a
# `v*` tag and by `build-on-demand.yml` for a throwaway build off any branch, so
# the packaging and signing steps exist once and cannot drift between the two.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the artifacts and their filenames.
        required: true
        type: string
      environment:
        description: >-
          GitHub environment the jobs run in. Only the signing environment holds
          the certificates, so an unsigned build cannot reach them by mistake.
        required: true
        type: string
      sign-macos:
        description: >-
          Sign and notarize the macOS builds, failing if a certificate is missing.
          When false, Gatekeeper refuses the result, so it is for testing only.
        required: true
        type: boolean
      sign-windows:
        description: >-
          Sign the Windows installer, failing if a certificate is missing. Kept
          separate from macOS so a release can ship while no Authenticode
          certificate exists; unsigned, SmartScreen warns on first run.
        required: true
        type: boolean
      stamp-version:
        description: >-
          Write `version` into apps/desktop-shell/package.json before packaging.
          On-demand builds need it because their version is derived; a `v*`
          release must leave the committed versions alone.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Signing that half-works is the failure worth catching early: Forge falls
      # back to an unsigned build when a variable is missing, and Gatekeeper only
      # reports it much later.
      - name: Require signing credentials
        if: inputs.sign-macos
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Environment ${{ inputs.environment }} is missing: ${missing[*]}"
            exit 1
          fi

      - name: Import signing certificate
        if: inputs.sign-macos
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/pizza-bot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null

      - name: Install
        run: npm ci

      # Stamping edits a manifest `npm ci` validates against the lockfile, so it
      # has to land after install and before Forge reads the version.
      - name: Stamp version
        if: inputs.stamp-version
        run: node scripts/build-version.mjs --set "${{ inputs.version }}"

      - name: Build installers
        run: npm run desktop:make -- --arch "${{ matrix.arch }}"

      - name: Verify signed application
        if: inputs.sign-macos
        shell: bash
        run: |
          app_path="$(find apps/desktop-shell/out -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Forge did not produce an application bundle"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release-assets
          dmg_path="$(find apps/desktop-shell/out/make -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop-shell/out/make -type f -name '*.zip' -print -quit)"
          if [[ -z "$dmg_path" || -z "$zip_path" ]]; then
            echo "::error::Forge did not produce both macOS release artifacts"
            exit 1
          fi
          cp "$dmg_path" "release-assets/pizza-bot-oss-${VERSION}-macos-${ARCH}.dmg"
          cp "$zip_path" "release-assets/pizza-bot-oss-${VERSION}-macos-${ARCH}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing certificate
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/pizza-bot-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apple-signing.p12"

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require signing credentials
        if: inputs.sign-windows
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $missing = @(
            "WINDOWS_CERTIFICATE_BASE64",
            "WINDOWS_CERTIFICATE_PASSWORD"
          ) | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Environment ${{ inputs.environment }} is missing: $($missing -join ', ')"
          }

      - name: Write signing certificate
        if: inputs.sign-windows
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "pizza-bot-signing.pfx"
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64"
          }
          [IO.File]::WriteAllBytes($certificatePath, $bytes)

      - name: Install
        run: npm ci

      - name: Stamp version
        if: inputs.stamp-version
        run: node scripts/build-version.mjs --set "${{ inputs.version }}"

      # forge.config.ts enables signing only when both variables are present, so
      # leaving them empty is what produces the unsigned installer.
      - name: Build installer
        env:
          WINDOWS_CERTIFICATE_FILE: ${{ inputs.sign-windows && format('{0}\pizza-bot-signing.pfx', runner.temp) || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.sign-windows && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run desktop:make -- --arch x64

      - name: Verify signed application and installer
        if: inputs.sign-windows
        shell: pwsh
        run: |
          $setup = @(
            Get-ChildItem "apps/desktop-shell/out/make/squirrel.windows" `
              -Recurse -File -Filter "*Setup.exe"
          )
          if ($setup.Count -ne 1) {
            throw "Expected one Squirrel Setup.exe, found $($setup.Count)"
          }

          $appExecutables = @(
            Get-ChildItem "apps/desktop-shell/out" -Recurse -File -Filter "*.exe" |
              Where-Object {
                $_.FullName -notlike "*\make\*" -and
                $_.Name -in @("pizza-bot-oss.exe", "Update.exe")
              }
          )
          if ($appExecutables.Count -lt 1) {
            throw "Forge did not produce a packaged application executable"
          }

          $targets = @($setup[0]) + $appExecutables
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($target.FullName): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing timestamp on Authenticode signature: $($target.FullName)"
            }
            Write-Host "Verified $($target.FullName)"
          }

      - name: Stage release asset
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $setup = @(
            Get-ChildItem "apps/desktop-shell/out/make/squirrel.windows" `
              -Recurse -File -Filter "*Setup.exe"
          )
          if ($setup.Count -ne 1) {
            throw "Expected one Squirrel Setup.exe, found $($setup.Count)"
          }
          New-Item -ItemType Directory -Path "release-assets" | Out-Null
          Copy-Item $setup[0].FullName `
            "release-assets/pizza-bot-oss-$env:VERSION-windows-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            (Join-Path $env:RUNNER_TEMP "pizza-bot-signing.pfx") `
            -Force -ErrorAction SilentlyContinue

  # Each architecture builds on its own runner rather than cross-packaging,
  # because better-sqlite3 is native and Forge would otherwise have to fetch a
  # foreign-arch prebuild during package.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fakeroot rpm

      - name: Install
        run: npm ci

      - name: Stamp version
        if: inputs.stamp-version
        run: node scripts/build-version.mjs --set "${{ inputs.version }}"

      - name: Build packages
        run: npm run desktop:make -- --arch "${{ matrix.arch }}"

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release-assets
          deb_path="$(find apps/desktop-shell/out/make -type f -name '*.deb' -print -quit)"
          rpm_path="$(find apps/desktop-shell/out/make -type f -name '*.rpm' -print -quit)"
          if [[ -z "$deb_path" || -z "$rpm_path" ]]; then
            echo "::error::Forge did not produce both Linux packages"
            exit 1
          fi
          cp "$deb_path" "release-assets/pizza-bot-oss-${VERSION}-linux-${ARCH}.deb"
          cp "$rpm_path" "release-assets/pizza-bot-oss-${VERSION}-linux-${ARCH}.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
