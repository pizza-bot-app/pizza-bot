name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 includes a linux-x64 prebuild, so no compiler setup is
      # needed for the native dependency.
      - name: Install
        run: npm ci

      # Exercise production workspace bundles before the longer test suite.
      - name: Build
        run: npm run build

      # tsc across the whole project-reference graph (the deep type gate).
      - name: Typecheck
        run: npm run typecheck

      # eslint flat config, including the core/protocol/ui purity guard.
      - name: Lint
        run: npm run lint

      # Includes license-generator tests before the capped Turbo suite; the cap
      # keeps parallel vitest workers from exhausting CI resources.
      - name: Test
        run: npm test

      - name: Bundle standalone backend
        run: npm run backend:bundle

      - name: Smoke standalone backend
        run: npm run backend:smoke

      # A clean image build catches build-stage dependencies the artifact smoke cannot.
      - name: Build backend container
        run: docker build --tag pizza-bot-backend:ci .

      - name: Smoke backend container
        run: >-
          docker run --rm
          --volume "$PWD/scripts:/smoke:ro"
          pizza-bot-backend:ci
          node /smoke/smoke-remote-backend.mjs
          --expect-playwright-unavailable
          /opt/pizza-bot

      # The published image serves the browser app beside the API on one origin.
      - name: Smoke browser app in backend container
        run: scripts/smoke-container.sh pizza-bot-backend:ci

      - name: Build browser-enabled backend container
        run: >-
          docker build
          --target runtime-with-browser
          --tag pizza-bot-backend-browser:ci
          .

      - name: Smoke Playwright in browser-enabled container
        run: >-
          docker run --rm
          --volume "$PWD/scripts:/smoke:ro"
          pizza-bot-backend-browser:ci
          node /smoke/smoke-playwright-mcp.mjs /opt/pizza-bot

      # Keep the network-dependent registry check last so it cannot hide
      # deterministic code, test, or build failures.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
