name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 includes a linux-x64 prebuild, so no compiler setup is
      # needed for the native dependency.
      - name: Install
        run: npm ci

      # Exercise production workspace bundles before the longer test suite.
      - name: Build
        run: npm run build

      # tsc across the whole project-reference graph (the deep type gate).
      - name: Typecheck
        run: npm run typecheck

      # eslint flat config, including the core/protocol/ui purity guard.
      - name: Lint
        run: npm run lint

      # Includes license-generator tests before the capped Turbo suite; the cap
      # keeps parallel vitest workers from exhausting CI resources.
      - name: Test
        run: npm test

  code-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Retried once: a deep chain of `npm` shims spawns nested cmd.exe processes,
      # and one intermittently dies with STATUS_DLL_INIT_FAILED (0xC0000142)
      # partway through the suite. See scripts/npm-cli.mjs. A genuinely failing
      # test fails both attempts.
      - name: Test
        shell: bash
        run: |
          npm test && exit 0
          echo "::warning::npm test failed on Windows; retrying once in case a nested cmd.exe died"
          npm test

  # The only coverage for running the artifact on a host, which
  # docs/STANDALONE_BACKEND.md documents as supported; the image smokes exercise
  # the same bundle inside a container.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Bundle standalone backend
        run: npm run backend:bundle

      - name: Smoke standalone backend
        run: npm run backend:smoke

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-image
        with:
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  # Releases package off `main`, so a broken forge.config.ts would otherwise
  # merge green and surface only when someone cuts one. `make` rather than
  # `package`: it is the command a release runs, and it exercises the deb and rpm
  # makers a release depends on.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fakeroot rpm

      - name: Install
        run: npm ci

      # Proves the derived version reaches the artifact, not just that Forge runs.
      - name: Stamp version
        run: node scripts/build-version.mjs --write

      - name: Build packages
        run: npm run desktop:make -- --arch x64

      - name: Verify packaged version and payload
        shell: bash
        run: |
          expected="$(node -p "require('./apps/desktop-shell/package.json').version")"
          root="$(find apps/desktop-shell/out -maxdepth 1 -type d -name 'Pizza Bot OSS-*' -print -quit)"
          if [[ -z "$root" ]]; then
            echo "::error::Forge did not produce a packaged application"
            exit 1
          fi

          # `dist` is the browser app; extraResource copies each entry by basename.
          resources="$root/resources"
          for required in dist dist-server plugins skills \
            LICENSE NOTICE THIRD_PARTY_LICENSES.txt; do
            if [[ ! -e "$resources/$required" ]]; then
              echo "::error::Packaged app is missing resources/$required"
              exit 1
            fi
          done

          # The manifest lives inside the asar, so read it the way Electron does.
          # @electron/asar ships as a dependency of @electron/packager.
          actual="$(node -e "
            const asar = require('@electron/asar');
            const manifest = asar.extractFile(process.argv[1], 'package.json');
            console.log(JSON.parse(manifest.toString('utf8')).version);
          " "$resources/app.asar")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Packaged version is $actual, expected $expected"
            exit 1
          fi

          for kind in deb rpm; do
            if [[ -z "$(find apps/desktop-shell/out/make -type f -name "*.$kind" -print -quit)" ]]; then
              echo "::error::Forge did not produce a .$kind package"
              exit 1
            fi
          done
          echo "packaged $expected with every expected resource, deb, and rpm"
