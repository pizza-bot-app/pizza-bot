name: Claude

# Comment events fire in this repository's context rather than the fork's, so
# unlike claude-code-review.yml this workflow reaches Bedrock on a fork pull
# request. It is the only way to review one. Because that context carries this
# repository's write token and AWS role, the pull request's code is built and
# run only when its branch lives in this repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  # Write so "@claude fix ..." can push a commit, not just review. Commits made
  # with GITHUB_TOKEN do not trigger CI; pass a GitHub App token instead if that
  # matters.
  contents: write
  pull-requests: write
  issues: write
  # Lets GitHub mint the OIDC token that AWS exchanges for role credentials.
  id-token: write
  # Lets Claude read CI results on a pull request.
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The action enforces write access itself, but only after the credential
      # steps have run. On a public repository any comment containing the
      # trigger phrase reaches those steps, so reject unauthorized actors before
      # a role session exists.
      - name: Verify actor has write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          level=$(gh api \
            "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" \
            --jq .permission 2>/dev/null || echo none)
          case "$level" in
            admin | write) echo "${{ github.actor }}: $level" ;;
            *) echo "::error::${{ github.actor }} lacks write access (permission: $level)" && exit 1 ;;
          esac

      - id: pr
        name: Resolve pull request
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository,headRefName,baseRefName --jq '
            "same_repo=\(.isCrossRepository | not)\nhead_ref=\(.headRefName)\nbase_ref=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.same_repo == 'true' && steps.pr.outputs.head_ref || '' }}
          fetch-depth: 0

      # No npm cache: this context shares main's cache scope, and the code
      # built here must not be able to plant entries main's builds restore.
      - if: steps.pr.outputs.same_repo == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Before the role session exists, so install scripts and the build never
      # see AWS credentials.
      - if: steps.pr.outputs.same_repo == 'true'
        name: Install and build
        run: npm ci --no-audit --no-fund && npm run build

      # hashFiles: older branches predate the action and still get a normal
      # answer, just without screenshots.
      - id: ui
        if: steps.pr.outputs.same_repo == 'true' && hashFiles('.github/actions/ui-preview/action.yml') != ''
        uses: ./.github/actions/ui-preview
        with:
          base-ref: ${{ steps.pr.outputs.base_ref }}
          force: ${{ contains(github.event.comment.body || github.event.review.body, 'screenshot') }}

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs Claude's commands in a sandbox
      # that needs bubblewrap and socat, which the action installs only when
      # allowed_non_write_users is set. Ubuntu 24.04 also blocks the
      # unprivileged user namespaces bubblewrap uses unless the sysctl is off.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - uses: anthropics/claude-code-action@v1
        env:
          # Strips cloud credentials from every command Claude runs, so the pull
          # request's code executes without the Bedrock role.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          PIZZA_DATA_ROOT: ${{ runner.temp }}/pizza-data
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          # Pinning the full model ID stops Claude Code from deriving a us.
          # profile from AWS_REGION. It does not confine the run to one model:
          # background tasks also invoke Haiku and Sonnet, inheriting the
          # global. prefix, so the role's policy must allow those profiles too.
          #
          # Overshooting --max-turns fails the job even when the review itself
          # succeeded and posted, so keep the cap clear of what a real review
          # costs; timeout-minutes is the actual runaway guard. In this
          # comment-triggered mode the action appends --allowedTools to its own
          # defaults rather than replacing them; the extra tools run the pull
          # request's code, so they are granted only on same-repository branches.
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --max-turns 100
            ${{ steps.pr.outputs.same_repo == 'true' && '--allowedTools "Bash(npm test:*),Bash(npx vitest:*),Bash(npx tsx:*),Bash(npx tsc:*),Bash(npm run:*),mcp__playwright"' || '' }}
            ${{ steps.ui.outputs.started == 'true' && format('--mcp-config {0} --append-system-prompt-file .github/prompts/ui-screenshots.md', steps.ui.outputs.mcp_config) || '' }}

      - if: always() && steps.ui.outputs.started == 'true'
        uses: ./.github/actions/ui-shots-post
        with:
          pr: ${{ github.event.issue.number || github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sticky: "false"
