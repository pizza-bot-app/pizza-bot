name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate tag and workspace versions
        id: version
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const expected = process.argv[2];
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const workspacePaths = Object.entries(lock.packages)
            .filter(([directory, entry]) =>
              directory === "" ||
              (!directory.startsWith("node_modules/") && entry.name)
            )
            .map(([directory]) => directory);
          const mismatches = [];

          for (const directory of workspacePaths) {
            const manifestPath = path.join(directory, "package.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const lockedVersion = lock.packages[directory].version;
            if (manifest.version !== expected || lockedVersion !== expected) {
              mismatches.push(
                `${manifestPath}: manifest=${manifest.version}, lock=${lockedVersion}`,
              );
            }
          }

          const pluginLock = JSON.parse(
            fs.readFileSync("plugins/package-lock.json", "utf8"),
          );
          for (const [directory, entry] of Object.entries(pluginLock.packages)) {
            if (directory === "" || directory.startsWith("node_modules/") || !entry.name) {
              continue;
            }
            const manifestPath = path.join("plugins", directory, "package.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.version !== entry.version) {
              mismatches.push(
                `${manifestPath}: manifest=${manifest.version}, plugins lock=${entry.version}`,
              );
            }
          }

          if (mismatches.length > 0) {
            console.error(`Tag v${expected} does not match every workspace version:`);
            console.error(mismatches.join("\n"));
            process.exit(1);
          }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package-macos:
    needs: [validate-release, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require signing and notarization secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::The release environment is missing $name"
              exit 1
            fi
          done

      - name: Import signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/pizza-bot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null

      - name: Install
        run: npm ci

      - name: Build signed installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:make -- --arch "${{ matrix.arch }}"

      - name: Verify signed application
        shell: bash
        run: |
          app_path="$(find apps/desktop-shell/out -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Forge did not produce an application bundle"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release-assets
          dmg_path="$(find apps/desktop-shell/out/make -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop-shell/out/make -type f -name '*.zip' -print -quit)"
          if [[ -z "$dmg_path" || -z "$zip_path" ]]; then
            echo "::error::Forge did not produce both macOS release artifacts"
            exit 1
          fi
          cp "$dmg_path" "release-assets/pizza-bot-oss-${VERSION}-macos-${ARCH}.dmg"
          cp "$zip_path" "release-assets/pizza-bot-oss-${VERSION}-macos-${ARCH}.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing certificate
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/pizza-bot-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apple-signing.p12"

  package-windows:
    needs: [validate-release, ci]
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $required = @(
            "WINDOWS_CERTIFICATE_BASE64",
            "WINDOWS_CERTIFICATE_PASSWORD"
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "The release environment is missing $name"
            }
          }

      - name: Write signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "pizza-bot-signing.pfx"
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64"
          }
          [IO.File]::WriteAllBytes($certificatePath, $bytes)

      - name: Install
        run: npm ci

      - name: Build signed installer
        env:
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}\pizza-bot-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run desktop:make -- --arch x64

      - name: Verify signed application and installer
        shell: pwsh
        run: |
          $setup = @(
            Get-ChildItem "apps/desktop-shell/out/make/squirrel.windows" `
              -Recurse -File -Filter "*Setup.exe"
          )
          if ($setup.Count -ne 1) {
            throw "Expected one Squirrel Setup.exe, found $($setup.Count)"
          }

          $appExecutables = @(
            Get-ChildItem "apps/desktop-shell/out" -Recurse -File -Filter "*.exe" |
              Where-Object {
                $_.FullName -notlike "*\make\*" -and
                $_.Name -in @("pizza-bot-oss.exe", "Update.exe")
              }
          )
          if ($appExecutables.Count -lt 1) {
            throw "Forge did not produce a packaged application executable"
          }

          $targets = @($setup[0]) + $appExecutables
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($target.FullName): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing timestamp on Authenticode signature: $($target.FullName)"
            }
            Write-Host "Verified $($target.FullName)"
          }

      - name: Stage release asset
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          $setup = @(
            Get-ChildItem "apps/desktop-shell/out/make/squirrel.windows" `
              -Recurse -File -Filter "*Setup.exe"
          )
          if ($setup.Count -ne 1) {
            throw "Expected one Squirrel Setup.exe, found $($setup.Count)"
          }
          New-Item -ItemType Directory -Path "release-assets"
          Copy-Item $setup[0].FullName `
            "release-assets/pizza-bot-oss-$env:VERSION-windows-x64-setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            (Join-Path $env:RUNNER_TEMP "pizza-bot-signing.pfx") `
            -Force -ErrorAction SilentlyContinue

  package-linux:
    needs: [validate-release, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fakeroot rpm

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run desktop:make

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          mkdir release-assets
          deb_path="$(find apps/desktop-shell/out/make -type f -name '*.deb' -print -quit)"
          rpm_path="$(find apps/desktop-shell/out/make -type f -name '*.rpm' -print -quit)"
          if [[ -z "$deb_path" || -z "$rpm_path" ]]; then
            echo "::error::Forge did not produce both Linux packages"
            exit 1
          fi
          cp "$deb_path" "release-assets/pizza-bot-oss-${VERSION}-linux-x64.deb"
          cp "$rpm_path" "release-assets/pizza-bot-oss-${VERSION}-linux-x64.rpm"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [validate-release, package-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create draft GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          existing="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true
          )"
          if [[ "$existing" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          elif [[ "$existing" == "false" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is already published"
            exit 1
          else
            args=(
              release create "$GITHUB_REF_NAME"
              --draft
              --generate-notes
              --title "Pizza Bot OSS $VERSION"
              --verify-tag
            )
            if [[ "$VERSION" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}" "${assets[@]}"
          fi
