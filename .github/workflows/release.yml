name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate tag and workspace versions
        id: version
        shell: bash
        run: |
          # Fetch main explicitly rather than trusting a remote-tracking ref to
          # exist: this gate decides whether unreviewed code can be released, and
          # a missing ref would make `merge-base` fail rather than report.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"

          # Every maker needs three numeric fields: rpm forbids `-` in a version,
          # `CFBundleVersion` is numeric-only, and Squirrel would not order a
          # prerelease label the way semver does. Reject one here rather than
          # failing halfway through packaging.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release versions must be major.minor.patch, got $version"
            exit 1
          fi
          if [[ "$version" == 0.* ]]; then
            echo "::error::0.x is reserved for on-demand builds"
            exit 1
          fi

          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const expected = process.argv[2];
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const workspacePaths = Object.entries(lock.packages)
            .filter(([directory, entry]) =>
              directory === "" ||
              (!directory.startsWith("node_modules/") && entry.name)
            )
            .map(([directory]) => directory);
          const mismatches = [];

          for (const directory of workspacePaths) {
            const manifestPath = path.join(directory, "package.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const lockedVersion = lock.packages[directory].version;
            if (manifest.version !== expected || lockedVersion !== expected) {
              mismatches.push(
                `${manifestPath}: manifest=${manifest.version}, lock=${lockedVersion}`,
              );
            }
          }

          const pluginLock = JSON.parse(
            fs.readFileSync("plugins/package-lock.json", "utf8"),
          );
          for (const [directory, entry] of Object.entries(pluginLock.packages)) {
            if (directory === "" || directory.startsWith("node_modules/") || !entry.name) {
              continue;
            }
            const manifestPath = path.join("plugins", directory, "package.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.version !== entry.version) {
              mismatches.push(
                `${manifestPath}: manifest=${manifest.version}, plugins lock=${entry.version}`,
              );
            }
          }

          if (mismatches.length > 0) {
            console.error(`Tag v${expected} does not match every workspace version:`);
            console.error(mismatches.join("\n"));
            process.exit(1);
          }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: [validate-release, ci]
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ needs.validate-release.outputs.version }}
      environment: release
      sign-macos: true
      # No Authenticode certificate exists yet, so a release ships an unsigned
      # Windows installer rather than not shipping. Flip this on with the
      # certificate; see CONTRIBUTING's Windows signing notes.
      sign-windows: false
      # The tag already matches every committed version, so stamping would be a
      # no-op at best and a divergence at worst.
      stamp-version: false

  # Last, and after the draft exists: pushing to a registry is the one step here
  # that cannot be undone, so nothing reaches GHCR until signing has succeeded and
  # its reviewer has approved. `latest` therefore only ever moves for a release
  # that produced installers.
  #
  # Each architecture is built, smoked, and pushed by digest on its own runner, so
  # nothing is tagged unless both legs pass; `publish` then names the index. CI
  # builds amd64 only, so an arm64 regression shows up here rather than on the PR,
  # and a failed leg leaves every tag where it was.
  image:
    needs: [validate-release, ci, package, draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/backend-image
        with:
          cache-to: type=gha,mode=max
          push-image: ghcr.io/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "::error::The backend image was not pushed"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate-release, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Resolve published tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-architecture index
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          if (( ${#sources[@]} != 2 )); then
            echo "::error::Expected 2 architecture digests, found ${#sources[@]}"
            exit 1
          fi

          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<<"$TAGS"

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published platforms
        run: |
          platforms="$(
            docker buildx imagetools inspect --raw "$IMAGE:$VERSION" |
              jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u
          )"
          for expected in linux/amd64 linux/arm64; do
            if ! grep -qx "$expected" <<<"$platforms"; then
              echo "::error::$IMAGE:$VERSION is missing $expected"
              exit 1
            fi
          done
          echo "published $IMAGE:$VERSION for $(paste -sd' ' - <<<"$platforms")"

  # No environment: the signing jobs already took the reviewer's approval, this
  # only assembles a draft, and publishing it is a separate manual act.
  draft-release:
    needs: [validate-release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # `gh` resolves the repository from a git remote and ignores
      # GITHUB_REPOSITORY, so without this it fails in a workspace with no
      # checkout — and `gh release view` swallowing that error would send a retry
      # down the create path instead of the upload path.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          # After the guard: an empty directory would make this fail on the glob
          # rather than report the missing artifacts.
          ( cd release-assets && sha256sum * > SHA256SUMS )
          assets+=(release-assets/SHA256SUMS)

          existing="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true
          )"
          if [[ "$existing" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          elif [[ "$existing" == "false" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is already published"
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "Pizza Bot OSS $VERSION" \
              --verify-tag \
              "${assets[@]}"
          fi
