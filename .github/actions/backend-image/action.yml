name: Build backend image
description: >-
  Builds both backend container image targets and smokes them, leaving
  pizza-bot-backend:candidate loaded locally for a caller that wants to push it.

# A composite action rather than a reusable workflow: a job that calls a reusable
# workflow reports its checks as `<caller> / <callee>`, which would not match the
# branch protection contexts.

inputs:
  cache-to:
    description: >-
      Buildx cache export, empty to only read. A pull request's cache entry is
      scoped to its own ref and evicted with it, so only main and releases write.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    # Loading the candidate locally means the smokes below and anything the
    # caller pushes resolve the same layers.
    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: runtime
        load: true
        tags: pizza-bot-backend:candidate
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to }}

    - name: Smoke backend image
      shell: bash
      run: >-
        docker run --rm
        --volume "$PWD/scripts:/smoke:ro"
        pizza-bot-backend:candidate
        node /smoke/smoke-remote-backend.mjs
        --expect-playwright-unavailable
        /opt/pizza-bot

    # The image serves the browser app beside the API on one origin.
    - name: Smoke browser app in backend image
      shell: bash
      run: scripts/smoke-container.sh pizza-bot-backend:candidate

    # Not published: chromium roughly doubles the image. It is built here so a
    # change cannot break it unnoticed.
    - name: Build browser-enabled image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: runtime-with-browser
        load: true
        tags: pizza-bot-backend-browser:candidate
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to }}

    - name: Smoke Playwright in browser-enabled image
      shell: bash
      run: >-
        docker run --rm
        --volume "$PWD/scripts:/smoke:ro"
        pizza-bot-backend-browser:candidate
        node /smoke/smoke-playwright-mcp.mjs /opt/pizza-bot
